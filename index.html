<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="あなたの作品とプロフィールを紹介するポートフォリオです。">
  <title>あなたの名前 | Portfolio</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --panel: #191b20;
      --text: #f5f5f2;
      --muted: #a3a5ad;
      --accent: #c6f36a;
      --line: #303239;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: sans-serif;
      line-height: 1.8;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1080px, 90%);
      margin: 0 auto;
    }

    .site-header {
      border-bottom: 1px solid var(--line);
    }

    .nav {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .logo {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .nav-links a:hover,
    .text-link:hover {
      color: var(--accent);
    }

    .hero {
      padding: 100px 0 88px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.16em;
    }

    h1 {
      max-width: 800px;
      margin: 18px 0;
      font-size: clamp(2.7rem, 8vw, 6rem);
      line-height: 1.12;
      letter-spacing: -0.05em;
    }

    .hero p {
      max-width: 600px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .button {
      display: inline-block;
      margin-top: 22px;
      padding: 12px 20px;
      border-radius: 999px;
      background: var(--accent);
      color: #171a10;
      font-weight: 700;
    }

    .button:hover {
      background: #d8ff8c;
    }

    section {
      padding: 64px 0;
      border-top: 1px solid var(--line);
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 28px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 1.8rem;
    }

    .section-heading span {
      color: var(--accent);
      font-size: 0.8rem;
      letter-spacing: 0.12em;
    }

    .about-text {
      max-width: 680px;
      color: var(--muted);
    }

    .work-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
    }

    .video-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #08090b;
    }

    .video-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .work-info {
      padding: 24px;
    }

    .work-info h3 {
      margin: 0 0 8px;
      font-size: 1.25rem;
    }

    .work-info p {
      margin: 0;
      color: var(--muted);
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .tag {
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .contact-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
    }

    .contact-box p {
      margin: 4px 0 0;
      color: var(--muted);
    }

    .text-link {
      color: var(--accent);
      white-space: nowrap;
    }

    footer {
      padding: 28px 0;
      color: var(--muted);
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      .nav {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        padding: 18px 0;
      }

      .nav-links {
        gap: 18px;
        font-size: 0.82rem;
      }

      .hero {
        padding: 72px 0 60px;
      }

      section {
        padding: 48px 0;
      }

      .contact-box {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="#">PORTFOLIO/a>
      <nav class="nav-links" aria-label="メインナビゲーション">
        <a href="#about">プロフィール</a>
        <a href="#works">作品</a>
        <a href="#contact">連絡先</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="hero" style="border-top: 0;">
        <span class="eyebrow">PORTFOLIO / 2026</span>
        <h1> 辻󠄀　  大河<br>Tsuji Taiga</h1>
        <p>
          バンタンゲームアカデミー東京校　/　専門部 ゲームプログラマー専攻
        </p>
        <a class="button" href="#works">作品を見る ↓</a>
      </section>

      <section id="about">
        <div class="section-heading">
          <h2>プロフィール</h2>
          <span>ABOUT</span>
        </div>
        <p class="about-text">
          趣味：料理・スノーボード<br>好きなゲーム：FPS・マルチゲーム・アクションゲーム
        </p>
      </section>

      <section id="works">
        <div class="section-heading">
          <h2>作品</h2>
          <span>SELECTED WORKS</span>
        </div>

        <article class="work-card">
          <div class="video-frame">
            <iframe
              src="https://www.youtube-nocookie.com/embed/rfmusFFDI98?start=49"
              title="作品動画"
              loading="lazy"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen>
            </iframe>
          </div>
          <div class="work-info">
            <h3>スラッシュ・スライム！</h3>
            <p>制作日：2026/07<br>初めての個人製作で作成いたしました。</p>
            <div class="tags">
              <span class="tag">映像</span>
              <span class="tag">2026</span>
            </div>
          </div>
        </article>
      </section>

      <section id="contact">
        <div class="section-heading">
          <h2>連絡先</h2>
          <span>CONTACT</span>
        </div>
        <div class="contact-box">
          <div>
            <strong>お問い合わせ</strong>
            <p>ご連絡はこちらからお願いします。</p>
          </div>
          <a class="text-link" href="mailto:taigatsuji84@gmail.com">メールを送る ↗</a>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">© 2026 辻󠄀大河 </div>
  </footer>
</body>
</html>
